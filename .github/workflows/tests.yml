name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q HRGUI10.py studio/HRtoVRC_Studio.py studio/hr_updater.py

      - name: Updater tests
        run: python studio/tests/test_updater.py

      - name: Live-settings tests
        run: python studio/tests/test_live_settings.py
